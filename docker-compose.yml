services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: peto-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
    networks:
      - peto-network

  frontend:
    build:
      context: ./Frontend/Peto_user
      dockerfile: Dockerfile
    container_name: peto-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - peto-network

networks:
  peto-network:
    driver: bridge
