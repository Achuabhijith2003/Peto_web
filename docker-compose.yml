services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: peto-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
    networks:
      - peto-network

  frontend:
    build:
      context: ./Frontend/Peto_user
      dockerfile: Dockerfile
    container_name: peto-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - peto-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: peto-admin
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - peto-network

  redis:
    image: redis:7-alpine
    container_name: peto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "25mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - peto-network

networks:
  peto-network:
    driver: bridge
